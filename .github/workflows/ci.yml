name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Lint (ESLint, including the unsafe-DOM rule)
        run: npm run lint
      - name: Regression tests (headless Chrome)
        run: BROWSER="$(command -v google-chrome || command -v chromium)" npm test
